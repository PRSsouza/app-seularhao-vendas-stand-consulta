<style> 
* { 
margin: 0; 
padding: 0; 
box-sizing: border-box; 
} 
html, body { 
width: 100%; 
height: 100%; 
overflow: hidden; 
background-color: #ffffff; 
} 
/* Empurra o topo do iframe para fora da tela visível, ocultando a 
barra */ 
iframe { 
position: absolute; 
top: -45px; 
left: 0; 
width: 100%; 
height: calc(100% + 45px); 
border: none; 
} 
</style> 
</head>
